<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Улучшение структуры метаданных -->
<title>Горизонт | Bing Archive</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:image" content="/favicon.png">
<meta property="og:url" content="https://antone777.github.io/">

<!-- Разделение стилей на компоненты -->
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: var(--pad);
    min-height: 100vh;
    color: white;
    font-family:
        system-ui,
        sans-serif;
    background:
        radial-gradient(
            circle at center,
            #2a2d32 0%,
            #141517 100%
        );
}

:root {
    --pad: 20px;
    --card-size: 220px;
    --btn-pad-hor: 34px;
}
@media (max-width: 600px) {
    :root {
        --pad: 14px;
        --card-size: calc(100vw - 32px);
        --btn-pad-hor: 20px;
    }
}

h1 {
    margin-top: var(--pad);
    text-align: center;
    font-size: clamp(2rem, 8vw, 3.2rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-weight: 200;
}
.status {
    color: #c7c7c7;
    text-align: center;
}

.grid {
    display: grid;
    gap: var(--pad);
    grid-template-columns:
        repeat(auto-fill, minmax(var(--card-size), 1fr));
}
.card {
    position: relative;
    width: 100%;
    height: var(--card-size);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
    /* Добавил стили для кнопки */
    &::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: multiply;
        background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
    }
}
.card:focus-visible,
.card:hover {
    outline: none;
    transform: scale(1.02);
}
.card img {
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
}
.card img.loaded {
    opacity: 1;
}
.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 16, 18, 0.95);
}
.lightbox.active {
    display: flex;
}
.lightbox img {
    max-width: 95%;
    max-height: 80%;
    object-fit: contain;
    user-select: none;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.close {
    position: absolute;
    top: var(--pad);
    right: var(--pad);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: all 0.3s ease;
}
.close svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.controls button {
    padding: 14px var(--btn-pad-hor);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-size: 14px;
    font-weight: 200;
    border-radius: 50px;
    backdrop-filter: blur(12px);
    transition: all 0.35s ease;
}
button.loading {
    opacity: 0.7;
    pointer-events: none;
}
button:not(.card):focus-visible,
button:not(.card):hover {
    outline: none;
    transform: translateY(-2px);
}
button:active {
    transform: scale(0.98);
}
</style>
</head>

<body>
<h1>Горизонт</h1>

<main class="grid" id="gallery"></main>

<div class="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр обоев">
    <button class="close" type="button" aria-label="Закрыть просмотр">
        <!-- SVG вынесен в отдельный тег для удобства редактирования -->
        <svg viewBox="0 0 24 24"><path d="M 7 7 L 17 17 M 17 7 L 7 17"/></svg>
    </button>
    <img alt="" referrerpolicy="no-referrer">
    <div class="controls">
        <button type="button">Скачать UHD</button>
    </div>
</div>

<script>
const gallery = document.getElementById('gallery');
const viewer = document.querySelector('.lightbox');
const bigImage = viewer.querySelector('img');
const downloadBtn = viewer.querySelector('.controls > button');
const closeBtn = viewer.querySelector('.close');

// Более понятные имена переменных
let currentItem = null;
let blobURL = null;
let imageLoadToken = 0;
let previouslyFocused = null;
let downloadController = null;

function setDownloadState(label, isLoading = false) {
    // Деструктуризация объекта для краткости
    const [textContent, loadingClass] = isLoading ? ['Загрузка...', 'loading'] : [label, undefined];
    downloadBtn.textContent = textContent;
    if (loadingClass !== undefined) downloadBtn.classList.toggle(loadingClass);
}

async function fetchBlob(url) {
    try {
        const response = await fetch(url, { signal: downloadController.signal });
        return response.ok ? response.blob() : Promise.reject(new Error(`HTTP ${response.status}`));
    } catch (err) {
        throw err;
    }
}

async function download(item) {
    cancelDownload();
    
    // Проверяем наличие URL и корректного значения
    const url = item?.url && typeof item.url === 'string' ? item.url.trim() : null;
    if (!url) return;

    const controller = new AbortController();
    downloadController = controller;

    setDownloadState('', true);

    try {
        const blob = await fetchBlob(url);
        releaseBlobURL();
        blobURL = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = blobURL;
        link.download = `${item.img_id || 'BING_IMAGE'}.jpg`;
        link.click();
        link.remove();

        setDownloadState('Скачать UHD');
    } catch (error) {
        if (!(error instanceof DOMException && error.name === "AbortError")) {
            setDownloadState('Ошибка загрузки', false);
        }
    } finally {
        if (downloadController === controller) downloadController = null;
    }
}

function openViewer({ preview, url, title, copyright }) {
    if (!preview && !url) return;

    currentItem = { preview, url };
    downloadBtn.dataset.fallbackUrl = url ?? null;
    previouslyFocused = document.activeElement;

    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';

    bigImage.alt = title || copyright || 'Обои Bing';
    bigImage.style.opacity = '0';

    const token = ++imageLoadToken;
    let usedPreview = false;

    const showImage = () => {
        if (token !== imageLoadToken) return;
        window.clearTimeout(fallbackTimer);
        bigImage.style.opacity = '1';
        setDownloadState('Скачать UHD');
    };

    const handleFallback = () => {
        if (token !== imageLoadToken || usedPreview || !preview) return;
        usedPreview = true;
        bigImage.src = preview;
    };

    // Убрали таймер, заменив его обработчиками событий
    bigImage.onload = () => {
        showImage();
        handleFallback(); // На случай, если изображение загрузилось слишком быстро
    };

    bigImage.onerror = () => {
        handleFallback();
        if (usedPreview) setDownloadState('Ошибка загрузки');
    };

    bigImage.src = url || preview;
    closeBtn.focus();
}

function closeViewer() {
    if (!viewer.classList.contains('active')) return;

    ++imageLoadToken;
    cancelDownload();
    releaseBlobURL();

    viewer.classList.remove('active');
    document.body.style.overflow = '';

    bigImage.removeAttribute('src');
    bigImage.style.opacity = '0';

    currentItem = null;
    downloadBtn.dataset.fallbackUrl = null;
    setDownloadState('Скачать UHD');

    previouslyFocused?.focus?.();
}

function sortItems(a, b) {
    return String(b.sort_key).localeCompare(String(a.sort_key));
}

function renderGallery(data) {
    const items = Array.isArray(data)
        ? data.filter(Boolean)
        : Object.values(data).filter(Boolean);

    const validItems = items
        .map((item) => ({
            ...item,
            hasMedia: Boolean(item.url || item.preview),
            label: [
                item.title,
                item.copyright,
                'обои Bing',
            ].find(Boolean),
        }))
        .filter(({ hasMedia }) => hasMedia)
        .sort(sortItems);

    if (!validItems.length) {
        gallery.innerHTML = '<p class="status">Архив пока пуст.</p>';
        return;
    }

    const fragment = document.createDocumentFragment();

    for (const { preview, label } of validItems) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.setAttribute('aria-label', `Открыть: ${label}`);
        card.addEventListener('click', () => openViewer({ preview }));

        const img = document.createElement('img');
        img.src = preview;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.alt = label;

        img.onload = () => img.classList.add('loaded');
        img.onerror = () => {
            img.classList.add('loaded');
            img.alt = 'Не удалось загрузить превью';
        };

        card.append(img);
        fragment.append(card);
    }

    gallery.replaceChildren(fragment);
}

async function loadGallery() {
    try {
        const res = await fetch('/data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderGallery(data);
    } catch (error) {
        console.error('Не удалось загрузить архив:', error);
        gallery.innerHTML = `<p class="status">Ошибка загрузки архива.</p>`;
    }
}

// Обработчики событий
downloadBtn.addEventListener('click', async () => {
    const fallbackUrl = downloadBtn.dataset.fallbackUrl;
    if (fallbackUrl) {
        window.open(fallbackUrl, '_blank', 'noopener,noreferrer');
        return;
    }
    download(currentItem);
});

closeBtn.addEventListener('click', closeViewer);
viewer.addEventListener('click', ({ target }) => target === viewer && closeViewer());
document.addEventListener('keydown', ({ key }) => key === 'Escape' && closeViewer());
window.addEventListener('beforeunload', () => {
    cancelDownload();
    releaseBlobURL();
});

// Вспомогательные функции
function releaseBlobURL() {
    if (blobURL) {
        URL.revokeObjectURL(blobURL);
        blobURL = null;
    }
}

function cancelDownload() {
    if (downloadController) {
        downloadController.abort();
        downloadController = null;
    }
}

loadGallery();
</script>
</body>
</html>
